<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI伙伴</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #app {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .loading-text {
            color: white;
            font-size: 24px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .markdown-content pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .markdown-content code {
            background: #f6f8fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-content p {
            margin: 8px 0;
        }

        .markdown-content ul, .markdown-content ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 16px;
            color: #6a737d;
            margin: 8px 0;
        }

        /* 思考内容折叠区域 */
        .thinking-block {
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .thinking-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .thinking-header:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .thinking-header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 8px;
            color: #7c7c8a;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .thinking-header-icon.expanded {
            transform: rotate(90deg);
        }

        .thinking-header-label {
            font-size: 13px;
            color: #7c7c8a;
            flex: 1;
        }

        .thinking-header-status {
            font-size: 12px;
            color: #5c5c6a;
            margin-left: 8px;
        }

        .thinking-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }

        .thinking-body.expanded {
            max-height: 500px;
            overflow-y: auto;
            padding: 0 14px 12px 14px;
        }

        .thinking-content {
            font-size: 13px;
            line-height: 1.7;
            color: #8b8b9a;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .thinking-content.streaming::after {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: #6a6a7a;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink-cursor 1s step-end infinite;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 回溯时间轴 hover 显示回溯按钮 */
        div[class*="rollback-btn"]:hover,
        div:hover > .rollback-btn {
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-container" v-if="!ready">
            <div class="loading-text">AI伙伴 加载中...</div>
        </div>
        <n-config-provider v-else :theme="darkTheme" :theme-overrides="themeOverrides">
            <n-message-provider>
                <n-dialog-provider>
                    <main-app></main-app>
                </n-dialog-provider>
            </n-message-provider>
        </n-config-provider>
    </div>

    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/naive-ui@2.38.1/dist/index.prod.js"></script>
    <script src="https://unpkg.com/marked@12.0.1/marked.min.js"></script>

    <script>
        const { createApp, ref, reactive, computed, onMounted, nextTick, h, defineComponent } = Vue;
        const naive = window.naive;

        // 主应用组件
        const MainApp = defineComponent({
            name: 'MainApp',
            setup() {
                const message = naive.useMessage();
                const dialog = naive.useDialog();

                // 状态
                const collapsed = ref(false);
                const activeMenu = ref('chat');
                const memoryTab = ref('medium');
                const systemTab = ref('command');

                // 主题
                const darkTheme = naive.darkTheme;
                const themeOverrides = {
                    common: {
                        primaryColor: '#409eff',
                        primaryColorHover: '#66b1ff',
                        primaryColorPressed: '#3a8ee6'
                    }
                };

                // 菜单
                const menuOptions = [
                    { label: '对话', key: 'chat', icon: () => h('span', '\u{1F514}') },
                    { label: '记忆', key: 'memory', icon: () => h('span', '\u{1F9E0}') },
                    { label: '回溯', key: 'rollback', icon: () => h('span', '\u{23F0}') },
                    { label: '系统', key: 'system', icon: () => h('span', '\u{1F4BB}') },
                    { label: '设置', key: 'settings', icon: () => h('span', '\u2699\uFE0F') }
                ];

                const pageTitle = computed(() => {
                    const titles = { chat: '对话', memory: '记忆管理', rollback: '记忆回溯', system: '系统管理', settings: '设置' };
                    return titles[activeMenu.value] || 'AI伙伴';
                });

                // 对话
                const messages = ref([]);
                const inputMessage = ref('');
                const isTyping = ref(false);
                const messageContainer = ref(null);
                const ws = ref(null);
                const logWs = ref(null);
                const statusWs = ref(null);

                // 记忆
                const mediumTermMemories = ref([]);
                const longTermMemories = ref([]);
                const memoryFilter = reactive({ search: '', minImportance: 0 });

                const filteredMediumMemories = computed(() => {
                    return mediumTermMemories.value.filter(mem => {
                        if (mem.data.importance_score < memoryFilter.minImportance) return false;
                        if (memoryFilter.search) {
                            const search = memoryFilter.search.toLowerCase();
                            return mem.data.topic_summary.toLowerCase().includes(search) ||
                                   mem.data.key_points.some(p => p.toLowerCase().includes(search));
                        }
                        return true;
                    });
                });

                // 系统
                const commandInput = ref('');
                const commandOutput = ref('');
                const logs = ref([]);
                const autoScroll = ref(true);
                const logContainer = ref(null);

                const quickCommands = [
                    { cmd: '/status', label: '系统状态', icon: '\u{1F4CA}' },
                    { cmd: '/short', label: '短期记忆', icon: '\u{1F4CB}' },
                    { cmd: '/archive', label: '手动归档', icon: '\u{1F4E6}' },
                    { cmd: '/reorganize', label: '手动重整', icon: '\u{1F504}' },
                    { cmd: '/help', label: '帮助', icon: '\u2753' }
                ];

                const systemStatus = reactive({
                    memory: { short_term: 0, short_term_max: 20, medium_term: 0, long_term: 0, type: 'unknown' },
                    agent: { archive: 'idle', reorganize: 'idle' },
                    api: { connected: false, model: '', response_time: 0 }
                });

                const memoryStatus = computed(() => ({
                    short: systemStatus.memory.short_term,
                    max: systemStatus.memory.short_term_max
                }));

                // 设置 - 动态配置
                const configSchema = ref([]);
                const configValues = reactive({});
                const configLoading = ref(false);
                const configSaving = ref(false);

                // 回溯
                const rollbackSnapshots = ref([]);
                const rollbackLoading = ref(false);
                const rollbackAgentRunning = ref(false);
                const selectedSnapshot = ref(null);
                const snapshotDetail = ref(null);
                const detailLoading = ref(false);

                // 方法
                const handleMenuChange = (key) => {
                    activeMenu.value = key;
                    if (key === 'settings') loadConfig();
                    triggerStatusUpdate();
                };

                const formatTime = (timestamp) => {
                    if (!timestamp) return '';
                    return new Date(timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                };

                const formatDateTime = (timestamp) => {
                    if (!timestamp) return '';
                    return new Date(timestamp).toLocaleString('zh-CN');
                };

                const renderMarkdown = (content) => {
                    if (!content) return '';
                    try { return marked.parse(content); } catch (e) { return content; }
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        if (messageContainer.value) {
                            messageContainer.value.scrollTop = messageContainer.value.scrollHeight;
                        }
                    });
                };

                const connectWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = protocol + '//' + window.location.host + '/ws/chat';
                    ws.value = new WebSocket(wsUrl);

                    ws.value.onopen = () => console.log('WebSocket连接已建立');

                    ws.value.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.type === 'thinking_chunk') {
                            if (messages.value.length > 0) {
                                const lastMsg = messages.value[messages.value.length - 1];
                                if (lastMsg.role === 'assistant') {
                                    lastMsg.thinking += data.content;
                                    nextTick(() => { scrollToBottom(); });
                                }
                            }
                        } else if (data.type === 'chunk') {
                            if (messages.value.length > 0) {
                                const lastMsg = messages.value[messages.value.length - 1];
                                if (lastMsg.role === 'assistant') {
                                    if (lastMsg.thinkingStreaming) {
                                        lastMsg.thinkingStreaming = false;
                                    }
                                    lastMsg.content += data.content;
                                    nextTick(() => { scrollToBottom(); });
                                }
                            }
                        } else if (data.type === 'done') {
                            isTyping.value = false;
                            if (messages.value.length > 0) {
                                const lastMsg = messages.value[messages.value.length - 1];
                                if (lastMsg.role === 'assistant') {
                                    lastMsg.streaming = false;
                                    lastMsg.thinkingStreaming = false;
                                }
                            }
                            scrollToBottom();
                        } else if (data.type === 'error') {
                            isTyping.value = false;
                            if (messages.value.length > 0) {
                                const lastMsg = messages.value[messages.value.length - 1];
                                if (lastMsg.role === 'assistant') {
                                    lastMsg.streaming = false;
                                    lastMsg.thinkingStreaming = false;
                                }
                            }
                            message.error(data.message);
                        } else if (data.type === 'command_result') {
                            commandOutput.value = data.message;
                        }
                    };

                    ws.value.onclose = () => {
                        console.log('WebSocket连接已关闭，5秒后重连...');
                        setTimeout(connectWebSocket, 5000);
                    };

                    ws.value.onerror = (error) => console.error('WebSocket错误:', error);
                };

                const connectLogWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = protocol + '//' + window.location.host + '/ws/logs';
                    logWs.value = new WebSocket(wsUrl);

                    logWs.value.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.type === 'log') {
                            logs.value.push(data);
                            if (logs.value.length > 500) logs.value.shift();
                            if (autoScroll.value) {
                                nextTick(() => {
                                    if (logContainer.value) {
                                        logContainer.value.scrollTop = logContainer.value.scrollHeight;
                                    }
                                });
                            }
                        }
                    };

                    logWs.value.onclose = () => setTimeout(connectLogWebSocket, 5000);
                };

                const connectStatusWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = protocol + '//' + window.location.host + '/ws/status';
                    statusWs.value = new WebSocket(wsUrl);

                    statusWs.value.onopen = () => console.log('状态WebSocket连接已建立');

                    statusWs.value.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.type === 'status_update') {
                            Object.assign(systemStatus, data.status);
                        }
                    };

                    statusWs.value.onclose = () => {
                        console.log('状态WebSocket连接已关闭，5秒后重连...');
                        setTimeout(connectStatusWebSocket, 5000);
                    };

                    statusWs.value.onerror = (error) => console.error('状态WebSocket错误:', error);
                };

                const sendMessage = () => {
                    const content = inputMessage.value.trim();
                    if (!content || isTyping.value) return;

                    messages.value.push(reactive({ role: 'user', content: content, timestamp: new Date().toISOString() }));
                    messages.value.push(reactive({ role: 'assistant', content: '', thinking: '', thinkingStreaming: true, thinkingExpanded: true, timestamp: new Date().toISOString(), streaming: true }));

                    inputMessage.value = '';
                    isTyping.value = true;
                    scrollToBottom();

                    if (ws.value && ws.value.readyState === WebSocket.OPEN) {
                        ws.value.send(JSON.stringify({ type: 'message', content: content }));
                    }

                    triggerStatusUpdate();
                };

                const loadHistory = async () => {
                    try {
                        const response = await fetch('/api/history');
                        const data = await response.json();
                        if (data.success) {
                            messages.value = data.messages.map(msg => ({
                                role: msg.role, content: msg.content, timestamp: msg.timestamp,
                                thinking: msg.thinking || '', thinkingStreaming: false, thinkingExpanded: false
                            }));
                            scrollToBottom();
                        }
                    } catch (e) { console.error('加载历史记录失败:', e); }
                };

                const loadMemories = async () => {
                    try {
                        const [mediumRes, longRes] = await Promise.all([
                            fetch('/api/memory/medium?limit=100'),
                            fetch('/api/memory/long?limit=100')
                        ]);
                        const mediumData = await mediumRes.json();
                        const longData = await longRes.json();
                        if (mediumData.success) mediumTermMemories.value = mediumData.memories;
                        if (longData.success) longTermMemories.value = longData.memories;
                    } catch (e) { console.error('加载记忆失败:', e); }
                };

                const deleteMemory = async (type, id) => {
                    dialog.warning({
                        title: '确认删除',
                        content: '确定要删除这条记忆吗？此操作不可恢复。',
                        positiveText: '删除',
                        negativeText: '取消',
                        onPositiveClick: async () => {
                            try {
                                const response = await fetch('/api/memory/' + type + '/' + id, { method: 'DELETE' });
                                const data = await response.json();
                                if (data.success) {
                                    message.success('删除成功');
                                    loadMemories();
                                    triggerStatusUpdate();
                                }
                            } catch (e) { message.error('删除失败'); }
                        }
                    });
                };

                const executeCommand = async (cmd) => {
                    if (!cmd) return;
                    commandInput.value = '';
                    try {
                        const response = await fetch('/api/command', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ command: cmd })
                        });
                        const data = await response.json();
                        commandOutput.value = data.result;
                        triggerStatusUpdate();
                    } catch (e) {
                        commandOutput.value = '错误: ' + e.message;
                    }
                };

                const clearLogs = () => { logs.value = []; };

                const loadSystemStatus = async () => {
                    try {
                        const response = await fetch('/api/status?light=true');
                        const data = await response.json();
                        if (data.success) Object.assign(systemStatus, data.status);
                    } catch (e) { console.error('加载系统状态失败:', e); }
                };

                const refreshData = () => {
                    if (activeMenu.value === 'chat') loadHistory();
                    else if (activeMenu.value === 'memory') loadMemories();
                    else if (activeMenu.value === 'rollback') loadRollbackSnapshots();
                    else if (activeMenu.value === 'system') loadSystemStatus();
                    loadSystemStatus();
                    message.success('已刷新');
                };

                const triggerStatusUpdate = () => {
                    if (statusWs.value && statusWs.value.readyState === WebSocket.OPEN) {
                        statusWs.value.send(JSON.stringify({ type: 'ping' }));
                    }
                };

                // 配置加载与保存
                const loadConfig = async () => {
                    configLoading.value = true;
                    try {
                        const [schemaRes, valuesRes] = await Promise.all([
                            fetch('/api/config/schema'),
                            fetch('/api/config')
                        ]);
                        const schemaData = await schemaRes.json();
                        const valuesData = await valuesRes.json();
                        if (schemaData.success) configSchema.value = schemaData.schema;
                        if (valuesData.success) {
                            Object.keys(configValues).forEach(k => delete configValues[k]);
                            Object.assign(configValues, valuesData.config);
                        }
                    } catch (e) {
                        console.error('加载配置失败:', e);
                        message.error('加载配置失败');
                    } finally {
                        configLoading.value = false;
                    }
                };

                const saveConfig = async () => {
                    configSaving.value = true;
                    try {
                        const response = await fetch('/api/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(configValues)
                        });
                        const data = await response.json();
                        if (data.success) {
                            message.success(data.message);
                        } else {
                            message.error('保存失败');
                        }
                    } catch (e) {
                        message.error('保存配置失败: ' + e.message);
                    } finally {
                        configSaving.value = false;
                    }
                };

                const resetConfig = async () => {
                    await loadConfig();
                    message.info('已重新加载当前配置');
                };

                const getEmotionType = (emotion) => {
                    const types = { positive: 'success', negative: 'error', neutral: 'default' };
                    return types[emotion] || 'default';
                };

                // 回溯相关方法
                const loadRollbackSnapshots = async () => {
                    rollbackLoading.value = true;
                    try {
                        const response = await fetch('/api/rollback/list');
                        const data = await response.json();
                        if (data.success) {
                            rollbackSnapshots.value = data.snapshots;
                            rollbackAgentRunning.value = data.agent_running;
                        }
                    } catch (e) {
                        console.error('加载回溯快照失败:', e);
                        message.error('加载回溯数据失败');
                    } finally {
                        rollbackLoading.value = false;
                    }
                };

                const loadSnapshotDetail = async (snapshotId) => {
                    detailLoading.value = true;
                    try {
                        const response = await fetch(`/api/rollback/${snapshotId}`);
                        const data = await response.json();
                        if (data.success) {
                            selectedSnapshot.value = snapshotId;
                            snapshotDetail.value = data.snapshot;
                        }
                    } catch (e) {
                        console.error('加载快照详情失败:', e);
                        message.error('加载快照详情失败');
                    } finally {
                        detailLoading.value = false;
                    }
                };

                const executeRollback = async (snapshotId) => {
                    const snapshot = rollbackSnapshots.value.find(s => s.snapshot_id === snapshotId);
                    const label = snapshot ? `${snapshot.agent_type} (${new Date(snapshot.created_at).toLocaleString('zh-CN')})` : snapshotId.slice(0, 8);

                    dialog.warning({
                        title: '确认回溯',
                        content: `确定要回溯到节点「${label}」吗？此操作将撤销该节点之后的所有Agent操作，且不可恢复。`,
                        positiveText: '确认回溯',
                        negativeText: '取消',
                        onPositiveClick: async () => {
                            try {
                                const response = await fetch(`/api/rollback/${snapshotId}/execute`, { method: 'POST' });
                                const data = await response.json();
                                if (data.success) {
                                    message.success(data.message);
                                    selectedSnapshot.value = null;
                                    snapshotDetail.value = null;
                                    await loadRollbackSnapshots();
                                } else {
                                    message.error(data.detail || data.message || '回溯失败');
                                }
                            } catch (e) {
                                message.error('回溯执行失败: ' + e.message);
                            }
                        }
                    });
                };

                const getActionLabel = (action) => {
                    const labels = { create: '新增', delete: '删除', merge: '合并', clean_short_term: '清理短期记忆' };
                    return labels[action] || action;
                };

                const getActionType = (action) => {
                    const types = { create: 'success', delete: 'error', merge: 'warning', clean_short_term: 'info' };
                    return types[action] || 'default';
                };

                const getTargetLabel = (target) => {
                    const labels = { medium_term: '中期记忆', long_term: '长期记忆', short_term: '短期记忆' };
                    return labels[target] || target;
                };

                const getAgentTypeLabel = (type) => {
                    const labels = { archive: '归档', reorganize: '重整' };
                    return labels[type] || type;
                };

                const getAgentTypeColor = (type) => {
                    const colors = { archive: 'info', reorganize: 'warning' };
                    return colors[type] || 'default';
                };

                const getEmotionText = (emotion) => {
                    const texts = { positive: '\u{1F60A} 积极', negative: '\u{1F622} 消极', neutral: '\u{1F610} 中性' };
                    return texts[emotion] || emotion;
                };

                const getMemoryTypeColor = (type) => {
                    const colors = { preference: 'info', rule: 'warning', event: 'success', knowledge: 'default', characteristic: 'error' };
                    return colors[type] || 'default';
                };

                const getMemoryTypeText = (type) => {
                    const texts = { preference: '偏好', rule: '规则', event: '事件', knowledge: '知识', characteristic: '特征' };
                    return texts[type] || type;
                };

                const getLogColor = (level) => {
                    const colors = { ERROR: '#f56c6c', WARNING: '#e6a23c', INFO: '#409eff', DEBUG: '#909399' };
                    return colors[level] || '#c9d1d9';
                };

                onMounted(async () => {
                    connectWebSocket();
                    connectLogWebSocket();
                    connectStatusWebSocket();

                    await Promise.all([loadHistory(), loadMemories(), loadSystemStatus(), loadRollbackSnapshots()]);
                });

                return {
                    collapsed, activeMenu, memoryTab, systemTab,
                    darkTheme, themeOverrides, menuOptions, pageTitle,
                    messages, inputMessage, isTyping, messageContainer,
                    mediumTermMemories, longTermMemories, memoryFilter, filteredMediumMemories,
                    commandInput, commandOutput, logs, autoScroll, logContainer,
                    quickCommands, systemStatus, memoryStatus,
                    configSchema, configValues, configLoading, configSaving,
                    rollbackSnapshots, rollbackLoading, rollbackAgentRunning,
                    selectedSnapshot, snapshotDetail, detailLoading,
                    handleMenuChange, formatTime, formatDateTime, renderMarkdown,
                    sendMessage, deleteMemory, executeCommand, clearLogs,
                    refreshData, loadConfig, saveConfig, resetConfig,
                    loadRollbackSnapshots, loadSnapshotDetail, executeRollback,
                    getActionLabel, getActionType, getTargetLabel,
                    getAgentTypeLabel, getAgentTypeColor,
                    getEmotionType, getEmotionText, getMemoryTypeColor, getMemoryTypeText, getLogColor,
                    triggerStatusUpdate
                };
            },
            template: `

                                                                        <n-card v-for="(item, idx) in op.deleted_data" :key="idx" size="small" style="margin-bottom: 4px;">
                                                                            <n-text depth="3" style="font-size: 11px;">ID: {{ item.id.slice(0, 8) }}</n-text>
                                                                            <div v-if="item.data" style="margin-top: 4px;">
                                                                                <n-text style="font-size: 12px;">
                                                                                    {{ item.data.topic_summary || item.data.topic || JSON.stringify(item.data).slice(0, 100) }}
                                                                                </n-text>
                                                                            </div>
                                                                        </n-card>
                                                                    </n-collapse-item>
                                                                </n-collapse>
                                                            </div>

                                                            <div v-else-if="op.action === 'clean_short_term'" style="margin-top: 4px;">
                                                                <n-text depth="3" style="font-size: 12px;">
                                                                    清理了 {{ op.deleted_data.length }} 条短期记忆
                                                                </n-text>
                                                                <n-collapse style="margin-top: 4px;">
                                                                    <n-collapse-item title="查看被清理的消息" name="stm">
                                                                        <n-card v-for="(item, idx) in op.deleted_data.slice(0, 10)" :key="idx" size="small" style="margin-bottom: 4px;">
                                                                            <n-text style="font-size: 12px;">
                                                                                [{{ item.role === 'user' ? '用户' : 'AI' }}] {{ item.content?.slice(0, 80) }}
                                                                            </n-text>
                                                                        </n-card>
                                                                        <n-text v-if="op.deleted_data.length > 10" depth="3" style="font-size: 11px;">
                                                                            ... 还有 {{ op.deleted_data.length - 10 }} 条
                                                                        </n-text>
                                                                    </n-collapse-item>
                                                                </n-collapse>
                                                            </div>
                                                        </n-timeline-item>
                                                    </n-timeline>
                                                </n-card>
                                            </n-spin>
                                        </div>
                                    </div>
                                </n-spin>
                            </div>

                            <!-- 设置页面 - 动态配置 -->
                            <div v-else-if="activeMenu === 'settings'" style="height: 100%; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;">
                                <n-card title="系统设置" style="width: 100%; max-width: 700px;">
                                    <template #header-extra>
                                        <n-space>
                                            <n-button @click="loadConfig" :loading="configLoading">
                                                刷新
                                            </n-button>
                                        </n-space>
                                    </template>

                                    <n-spin :show="configLoading">
                                        <div v-if="configSchema.length === 0 && !configLoading" style="text-align: center; padding: 40px; color: #999;">
                                            <n-text depth="3">点击"刷新"加载配置</n-text>
                                        </div>

                                        <n-form label-placement="left" label-width="140px">
                                            <div v-for="group in configSchema" :key="group.group">
                                                <n-divider>{{ group.group }}</n-divider>
                                                <n-form-item v-for="item in group.items" :key="item.key" :label="item.label">
                                                    <n-space vertical style="width: 100%;">
                                                        <!-- slider 类型 -->
                                                        <n-slider v-if="item.type === 'slider'"
                                                            v-model:value="configValues[item.key]"
                                                            :min="item.min"
                                                            :max="item.max"
                                                            :step="item.step"
                                                        />
                                                        <!-- number 类型 -->
                                                        <n-input-number v-else-if="item.type === 'number'"
                                                            v-model:value="configValues[item.key]"
                                                            :min="item.min"
                                                            :max="item.max"
                                                            style="width: 100%;"
                                                        />
                                                        <!-- select 类型 -->
                                                        <n-select v-else-if="item.type === 'select'"
                                                            v-model:value="configValues[item.key]"
                                                            :options="item.options"
                                                        />
                                                        <!-- password 类型 -->
                                                        <n-input v-else-if="item.type === 'password'"
                                                            v-model:value="configValues[item.key]"
                                                            type="password"
                                                            show-password-on="click"
                                                            :placeholder="configValues[item.key] ? '已配置（点击修改）' : '未配置'"
                                                        />
                                                        <!-- string 类型 -->
                                                        <n-input v-else
                                                            v-model:value="configValues[item.key]"
                                                        />
                                                        <n-text v-if="item.description" depth="3" style="font-size: 12px;">
                                                            {{ item.description }}
                                                        </n-text>
                                                    </n-space>
                                                </n-form-item>
                                            </div>
                                        </n-form>

                                        <n-space style="margin-top: 20px;" justify="center">
                                            <n-button type="primary" @click="saveConfig" :loading="configSaving">
                                                保存配置
                                            </n-button>
                                            <n-button @click="resetConfig" :loading="configLoading">
                                                重置
                                            </n-button>
                                        </n-space>
                                    </n-spin>
                                </n-card>
                            </div>
                        </n-layout-content>
                    </n-layout>
                </n-layout>
            `
        });

        const app = createApp({
            components: { MainApp },
            setup() {
                const ready = ref(false);
                onMounted(() => {
                    setTimeout(() => { ready.value = true; }, 100);
                });
                return { ready, darkTheme: naive.darkTheme, themeOverrides: {
                    common: { primaryColor: '#409eff', primaryColorHover: '#66b1ff', primaryColorPressed: '#3a8ee6' }
                }};
            },
            template: `
                <div class="loading-container" v-if="!ready">
                    <div class="loading-text">AI伙伴 加载中...</div>
                </div>
                <n-config-provider v-else :theme="darkTheme" :theme-overrides="themeOverrides">
                    <n-message-provider>
                        <n-dialog-provider>
                            <main-app></main-app>
                        </n-dialog-provider>
                    </n-message-provider>
                </n-config-provider>
            `
        });

        app.use(naive);
        app.mount('#app');
    </script>
</body>
</html>
