version: '3.8'

services:
  ai-companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-companion
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./prompts:/app/prompts
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-companion-network

networks:
  ai-companion-network:
    driver: bridge
