api:
  api_key: "${API_KEY}"
  model: glm-4.7
  base_url: https://open.bigmodel.cn/api/paas/v4/
agent_api:
  api_key: "${AGENT_API_KEY}"
  model: glm-4.7
  base_url: https://open.bigmodel.cn/api/paas/v4/
  tool_choice: auto
agent:
  archive:
    max_iterations: 20
  reorganize:
    max_iterations: 40
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  db: ${REDIS_DB}
  password: ${REDIS_PASSWORD}
  prefix: ${REDIS_PREFIX}
short_term_memory:
  max_turns: 20
  persist_file: data/short_term_memory.json
memory_system:
  type: full
chat:
  temperature: 0.7
  max_tokens: 2000
  timeout: 60
prompts:
  system_prompt: prompts/system_prompt.txt
  user_prompt: prompts/user_prompt.txt
  archive_agent: memory/prompts/archive_agent_prompt.txt
  reorganize_agent: memory/prompts/reorganize_agent_prompt.txt
logging:
  level: DEBUG
  log_dir: logs
  log_file: ai_companion.log
  enable_file: false
memory_retrieval:
  medium_term_count: 3
  long_term_count: 2
vector_db:
  mode: ${VECTOR_DB_MODE}
  remote_host: ${CHROMA_HOST}
  remote_port: ${CHROMA_PORT}
  embedding_type: ${EMBEDDING_TYPE}
  embedding_model: embedding-3
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: https://open.bigmodel.cn/api/paas/v4/
  local_embedding_model: shibing624/text2vec-base-chinese
  persistence_dir: data/chromadb
  collection_medium: medium_term_memories
  collection_long: long_term_memories
memory_flow:
  archive_interval_days: 7
  flow_state_file: data/memory_flow_state.json
rollback:
  enabled: true
  max_snapshots: 50
  storage_dir: data/rollback_snapshots
commands:
  prefix: /
